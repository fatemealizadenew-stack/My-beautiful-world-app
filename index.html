
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8e8ef">
  <title>دنیای قشنگ من</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #fff1f5, #f5eaff);
      color: #594354;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: white;
      padding: 40px 25px;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(100, 60, 90, 0.1);
    }

    h1 {
      color: #bd7196;
      font-size: 28px;
    }

    p {
      line-height: 2;
      font-size: 16px;
    }

    button {
      background: #c47ca0;
      color: white;
      border: none;
      padding: 13px 28px;
      border-radius: 25px;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>به دنیای قشنگ من خوش آمدی</h1>
    <p>اینجا جایی برای رویاها، هدف‌ها و لحظه‌های زیبای زندگی است.</p>
    <button onclick="alert('زندگی زیباست!')">
      شروع یک روز قشنگ
    </button>
  </main>
</body>
</html>
